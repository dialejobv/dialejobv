<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 880 180" width="880" height="180" role="img" aria-label="Assistive robot for Alzheimer's memory training" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Assistive robot for Alzheimer's memory training</title>
  <style>
    .t{font:700 29px 'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#EAF2F8}
    .tag{font:17px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#5CE1E6}
    .tr{fill:none;stroke:#B9772F;stroke-width:3;stroke-linecap:round}
    .pu{fill:none;stroke:#5CE1E6;stroke-width:3;stroke-linecap:round;stroke-dasharray:6 100;stroke-dashoffset:106;animation:run 4s linear infinite}
    @keyframes run{to{stroke-dashoffset:0}}
    .fc{transform-box:fill-box;transform-origin:center;animation:flip 8s infinite}
    .fr{opacity:0;animation:face 8s infinite}
    .gb{animation-delay:-4s}
    .led{animation:bl 1.4s infinite}
    .eye{animation:lk 4s ease-in-out infinite}
    @keyframes flip{0%,8%{transform:scaleX(1)}13%{transform:scaleX(0)}18%,42%{transform:scaleX(1)}47%{transform:scaleX(0)}52%,100%{transform:scaleX(1)}}
    @keyframes face{0%,13%{opacity:0}13.1%,47%{opacity:1}47.1%,100%{opacity:0}}
    @keyframes bl{50%{opacity:.2}}
    @keyframes lk{0%,100%{transform:translate(0,0)}50%{transform:translate(3px,1px)}}
  </style>
