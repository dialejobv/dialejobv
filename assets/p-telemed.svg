    .pu{fill:none;stroke:#5CE1E6;stroke-width:3;stroke-linecap:round;stroke-dasharray:6 100;stroke-dashoffset:106;animation:run 4s linear infinite}
    @keyframes run{to{stroke-dashoffset:0}}
    .ecg{fill:none;stroke:#5CE1E6;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:100;animation:ec 2.2s linear infinite}
    @keyframes ec{from{stroke-dashoffset:100}to{stroke-dashoffset:-100}}
