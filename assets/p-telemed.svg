    @keyframes ar{40%{opacity:1}}
    .hb{transform-box:fill-box;transform-origin:center;animation:hb 1.1s ease-in-out infinite}
    @keyframes hb{0%,100%{transform:scale(1)}20%{transform:scale(1.25)}40%{transform:scale(1)}}
  </style>
