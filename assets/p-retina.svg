<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 880 180" width="880" height="180" role="img" aria-label="Detecting diabetic retinopathy with neural networks" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Detecting diabetic retinopathy with neural networks</title>
  <style>
    .t{font:700 29px 'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#EAF2F8}
    .tag{font:17px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#5CE1E6}
    .tr{fill:none;stroke:#B9772F;stroke-width:3;stroke-linecap:round}
    .pu{fill:none;stroke:#5CE1E6;stroke-width:3;stroke-linecap:round;stroke-dasharray:6 100;stroke-dashoffset:106;animation:run 4s linear infinite}
    @keyframes run{to{stroke-dashoffset:0}}
    .scan{animation:sc 5s linear infinite}
    .bx{fill:none;stroke:#5CE1E6;stroke-width:2.5;opacity:0;animation:bx 5s infinite}
    .b2{animation-delay:.5s}.b3{animation-delay:1s}
    .ls{animation:ls 1.2s ease-in-out infinite}
    @keyframes sc{0%{transform:translateX(0)}60%,100%{transform:translateX(140px)}}
    @keyframes bx{0%,20%{opacity:0}26%,90%{opacity:1}100%{opacity:0}}
    @keyframes ls{50%{opacity:.45}}
  </style>
  <defs><clipPath id="scr"><rect x="14" y="14" width="292" height="152" rx="12"/></clipPath></defs>
  <rect width="880" height="180" rx="18" fill="#0E2A47"/>
  <rect x="5" y="5" width="870" height="170" rx="14" fill="none" stroke="#17406A" stroke-width="2"/>
  <rect x="14" y="14" width="292" height="152" rx="12" fill="#081B30"/>
  <g clip-path="url(#scr)">
    <defs><clipPath id="eye"><circle cx="160" cy="90" r="66"/></clipPath>
    <radialGradient id="fg" cx=".6" cy=".45"><stop offset="0" stop-color="#C4572F"/><stop offset="1" stop-color="#5A2318"/></radialGradient></defs>
    <circle cx="160" cy="90" r="66" fill="url(#fg)"/>
    <g clip-path="url(#eye)">
      <g fill="none" stroke="#F0B27A" stroke-width="2.2" stroke-linecap="round" opacity=".85">
        <path d="M198 86C172 58 140 48 104 62"/><path d="M198 86C172 112 140 130 106 124"/>
        <path d="M198 86C184 66 176 44 150 30"/><path d="M198 86C184 108 178 130 156 148"/>
        <path d="M150 62C140 72 132 76 118 80"/><path d="M148 116C140 106 130 102 116 100"/>
      </g>
      <circle cx="198" cy="86" r="13" fill="#F6D29A"/>
      <circle class="ls" cx="130" cy="82" r="3.5" fill="#FF6B9D"/><circle class="ls" cx="152" cy="116" r="3.5" fill="#FF6B9D"/><circle class="ls" cx="120" cy="106" r="3" fill="#FF6B9D"/>
      <rect class="scan" x="90" y="20" width="4" height="140" fill="#5CE1E6" opacity=".85"/>
    </g>
    <circle cx="160" cy="90" r="66" fill="none" stroke="#E8A04C" stroke-width="3"/>
    <rect class="bx" x="121" y="73" width="18" height="18" rx="3"/><rect class="bx b2" x="111" y="97" width="18" height="18" rx="3"/><rect class="bx b3" x="143" y="107" width="18" height="18" rx="3"/>
    <path d="M250 60v60M240 70l10-10l10 10" fill="none" stroke="#17406A" stroke-width="0"/>
  </g>
  <rect x="14" y="14" width="292" height="152" rx="12" fill="none" stroke="#17406A" stroke-width="2"/>
  <text class="tag" x="336" y="52">Springer</text>
  <text class="t" x="336" y="92">Detecting diabetic retinopathy</text>
  <text class="t" x="336" y="128">with neural networks</text>
  <path class="tr" d="M336 152H800L820 132H866"/>
  <path class="pu" pathLength="100" d="M336 152H800L820 132H866"/>
  <circle cx="336" cy="152" r="5" fill="#0E2A47" stroke="#E8A04C" stroke-width="3"/>
</svg>
