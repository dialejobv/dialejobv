<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 230" width="880" height="230" role="img" aria-labelledby="rt rd" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="rt">A robot pointing at the contribution graph below</title>
  <desc id="rd">A small assistive robot with two camera eyes scans and points down at Diego Barragán's GitHub contributions.</desc>
  <style>
    .head-line{font:700 30px 'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#EAF2F8}
    .sub{font:17px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#5CE1E6}
    .silk{font:16px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#9DB4C8}
    .shell{fill:#EAF2F8}
    .dark{fill:#081B30}
    .copper{fill:#E8A04C}
    .limb{fill:none;stroke:#EAF2F8;stroke-width:11;stroke-linecap:round;stroke-linejoin:round}
    .led{fill:#5CE1E6;animation:blink 1.6s ease-in-out infinite}
    .iris{fill:#5CE1E6;animation:look 6s ease-in-out infinite}
    .lid{transform-box:fill-box;transform-origin:center;animation:lid 6s infinite}
    .arm{transform-box:view-box;transform-origin:206px 140px;animation:point 2.4s ease-in-out infinite}
    .bar{fill:#5CE1E6;transform-box:fill-box;transform-origin:bottom;animation:grow 3s ease-in-out infinite}
    .b2{animation-delay:.3s}.b3{animation-delay:.6s}.b4{animation-delay:.9s}.b5{animation-delay:1.2s}
    .trace{fill:none;stroke:#B9772F;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
    .pulse{fill:none;stroke:#5CE1E6;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:8 100;stroke-dashoffset:108;animation:run 2.4s linear infinite}
    .chev{fill:none;stroke:#E8A04C;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;opacity:.25;animation:chev 1.5s infinite}
    .c2{animation-delay:.25s}.c3{animation-delay:.5s}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
    @keyframes look{0%,100%{transform:translate(0,0)}25%{transform:translate(4px,3px)}55%{transform:translate(2px,5px)}80%{transform:translate(-3px,2px)}}
    @keyframes lid{0%,46%,50%,100%{transform:scaleY(1)}48%{transform:scaleY(.1)}}
    @keyframes point{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-7deg)}}
    @keyframes grow{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
    @keyframes run{to{stroke-dashoffset:0}}
    @keyframes chev{0%,100%{opacity:.25}40%{opacity:1}}
    @media (prefers-reduced-motion:reduce){
      .led,.iris,.lid,.arm,.bar,.pulse,.chev{animation:none}
      .chev{opacity:1}
      .pulse{stroke-dashoffset:50}
    }
  </style>

  <rect width="880" height="230" rx="18" fill="#0E2A47"/>
  <rect x="6" y="6" width="868" height="218" rx="14" fill="none" stroke="#17406A" stroke-width="2"/>

  <!-- trace from the robot's hand down to the graph below -->
  <path class="trace" d="M262 196V212H830V230"/>
  <path class="pulse" pathLength="100" d="M262 196V212H830V230"/>

  <!-- robot -->
  <g>
    <line x1="150" y1="34" x2="150" y2="52" stroke="#E8A04C" stroke-width="4" stroke-linecap="round"/>
    <circle class="led" cx="150" cy="28" r="6"/>
    <rect class="shell" x="98" y="50" width="104" height="66" rx="20"/>
    <rect class="dark" x="108" y="62" width="84" height="42" rx="16"/>
    <g class="lid">
      <circle cx="132" cy="83" r="13" fill="#0E2A47" stroke="#E8A04C" stroke-width="3"/>
      <circle class="iris" cx="132" cy="83" r="5"/>
    </g>
    <g class="lid">
      <circle cx="168" cy="83" r="13" fill="#0E2A47" stroke="#E8A04C" stroke-width="3"/>
      <circle class="iris" cx="168" cy="83" r="5"/>
    </g>
    <rect class="copper" x="140" y="116" width="20" height="9" rx="2"/>
    <!-- resting arm -->
    <path class="limb" d="M96 140L76 172"/>
    <circle class="copper" cx="74" cy="177" r="8"/>
    <!-- body -->
    <rect class="shell" x="94" y="124" width="112" height="70" rx="16"/>
    <rect class="dark" x="110" y="136" width="80" height="36" rx="7"/>
    <rect class="bar" x="119" y="144" width="8" height="22" rx="2"/>
    <rect class="bar b2" x="133" y="144" width="8" height="22" rx="2"/>
    <rect class="bar b3" x="147" y="144" width="8" height="22" rx="2"/>
    <rect class="bar b4" x="161" y="144" width="8" height="22" rx="2"/>
    <rect class="bar b5" x="175" y="144" width="8" height="22" rx="2"/>
    <circle class="copper" cx="118" cy="182" r="3"/>
    <circle class="copper" cx="130" cy="182" r="3"/>
    <rect class="copper" x="112" y="194" width="76" height="11" rx="5.5"/>
    <!-- pointing arm -->
    <g class="arm">
      <path class="limb" d="M206 140L242 152L260 184"/>
      <circle class="copper" cx="261" cy="188" r="8"/>
    </g>
  </g>

  <!-- message -->
  <text class="silk" x="320" y="70">contribution scan / github.com/dialejobv</text>
  <text class="head-line" x="320" y="112">My latest work, measured below</text>
  <text class="sub" x="320" y="142">Commits, pull requests and reviews, last 31 days</text>

  <!-- chevrons pointing down -->
  <path class="chev" d="M816 150l14 12l14-12"/>
  <path class="chev c2" d="M816 166l14 12l14-12"/>
  <path class="chev c3" d="M816 182l14 12l14-12"/>
</svg>
