<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 880 180" width="880" height="180" role="img" aria-label="Neural yaw control for wind turbines" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Neural yaw control for wind turbines</title>
  <style>
    .t{font:700 29px 'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#EAF2F8}
    .tag{font:17px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#5CE1E6}
    .tr{fill:none;stroke:#B9772F;stroke-width:3;stroke-linecap:round}
    .pu{fill:none;stroke:#5CE1E6;stroke-width:3;stroke-linecap:round;stroke-dasharray:6 100;stroke-dashoffset:106;animation:run 4s linear infinite}
    @keyframes run{to{stroke-dashoffset:0}}
    .wd{fill:none;stroke:#5CE1E6;stroke-width:3;stroke-linecap:round;stroke-dasharray:22 18;animation:wd 1.2s linear infinite}
    .w2{animation-duration:1.6s;opacity:.6}.w3{animation-duration:1s;opacity:.8}
    @keyframes wd{from{stroke-dashoffset:40}to{stroke-dashoffset:0}}
    .lb{font:15px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#EAF2F8}
  </style>
  <defs><clipPath id="scr"><rect x="14" y="14" width="292" height="152" rx="12"/></clipPath></defs>
  <rect width="880" height="180" rx="18" fill="#0E2A47"/>
  <rect x="5" y="5" width="870" height="170" rx="14" fill="none" stroke="#17406A" stroke-width="2"/>
  <rect x="14" y="14" width="292" height="152" rx="12" fill="#081B30"/>
  <g clip-path="url(#scr)">
    <path class="wd" d="M14 48H96"/><path class="wd w2" d="M14 84H84"/><path class="wd w3" d="M14 120H100"/>
    <path d="M145 166L148 76H152L155 166Z" fill="#EAF2F8"/>
    <rect x="138" y="62" width="30" height="14" rx="6" fill="#EAF2F8"/>
    <g><path d="M150 66q8 -24 0 -52q-8 28 0 52Z" fill="#EAF2F8"/><g transform="rotate(120 150 68)"><path d="M150 66q8 -24 0 -52q-8 28 0 52Z" fill="#EAF2F8"/></g><g transform="rotate(240 150 68)"><path d="M150 66q8 -24 0 -52q-8 28 0 52Z" fill="#EAF2F8"/></g>
      <animateTransform attributeName="transform" type="rotate" from="0 150 68" to="360 150 68" dur="3.5s" repeatCount="indefinite"/></g>
    <circle cx="150" cy="68" r="6" fill="#E8A04C"/>
    <circle cx="244" cy="82" r="38" fill="#0E2A47" stroke="#E8A04C" stroke-width="3"/>
    <g stroke="#17406A" stroke-width="3" stroke-linecap="round"><path d="M244 50v8"/><path d="M212 82h8"/><path d="M268 82h8"/><path d="M221 59l6 6"/><path d="M267 59l-6 6"/></g>
    <g><path d="M244 82V54" stroke="#5CE1E6" stroke-width="4" stroke-linecap="round"/><path d="M238 60L244 48L250 60Z" fill="#5CE1E6"/>
      <animateTransform attributeName="transform" type="rotate" values="-50 244 82;30 244 82;-12 244 82;8 244 82;0 244 82;0 244 82;-50 244 82" keyTimes="0;.25;.45;.6;.72;.92;1" dur="6s" repeatCount="indefinite"/></g>
    <circle cx="244" cy="82" r="5" fill="#E8A04C"/>
    <text class="lb" x="244" y="146" text-anchor="middle">yaw</text>
  </g>
  <rect x="14" y="14" width="292" height="152" rx="12" fill="none" stroke="#17406A" stroke-width="2"/>
  <text class="tag" x="336" y="52">IEEE + IJAER</text>
  <text class="t" x="336" y="92">Neural yaw control</text>
  <text class="t" x="336" y="128">for wind turbines</text>
