<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 880 180" width="880" height="180" role="img" aria-label="Carpal tunnel prevention with neural networks" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Carpal tunnel prevention with neural networks</title>
  <style>
    .t{font:700 29px 'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#EAF2F8}
