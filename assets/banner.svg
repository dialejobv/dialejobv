<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" width="880" height="260" role="img" aria-labelledby="bt bd" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="bt">Diego Barragán: electronics engineer, robotics and AI researcher</title>
  <desc id="bd">A circuit board with copper traces carrying signals into a chip, next to Diego Barragán's name and roles.</desc>
  <style>
    .name{font:700 54px 'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#EAF2F8;letter-spacing:.5px}
    .role{font:500 21px 'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#5CE1E6;opacity:0;animation:cycle 16s infinite}
    .r2{animation-delay:4s}.r3{animation-delay:8s}.r4{animation-delay:12s}
    .silk{font:16px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#9DB4C8}
    .mark{font:700 15px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#9DB4C8}
    .trace{fill:none;stroke:#B9772F;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
    .pulse{fill:none;stroke:#5CE1E6;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:6 100;stroke-dashoffset:106;animation:run 5s linear infinite}
    .p2{animation-delay:1.2s}.p3{animation-delay:2.4s}.p4{animation-delay:3.4s}.p5{animation-delay:.6s}.p6{animation-delay:3s}
    .via{fill:#0E2A47;stroke:#E8A04C;stroke-width:3}
    .pin{fill:#E8A04C}
    .led{fill:#5CE1E6;animation:blink 2s ease-in-out infinite}
    @keyframes run{to{stroke-dashoffset:0}}
    @keyframes cycle{0%{opacity:0}3%{opacity:1}22%{opacity:1}25%{opacity:0}100%{opacity:0}}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
    @media (prefers-reduced-motion:reduce){
      .pulse,.led{animation:none}
      .pulse{stroke-dashoffset:60}
      .role{animation:none}
      .r1{opacity:1}
    }
  </style>

  <rect width="880" height="260" rx="18" fill="#0E2A47"/>
  <rect x="6" y="6" width="868" height="248" rx="14" fill="none" stroke="#17406A" stroke-width="2"/>

  <!-- copper traces into the chip -->
  <path class="trace" d="M0 40H598L656 98H668"/>
  <path class="trace" d="M0 56H574L636 118H668"/>
  <path class="trace" d="M0 222H540L620 142H668"/>
  <path class="trace" d="M0 238H592L668 162"/>
  <!-- traces out of the chip -->
  <path class="trace" d="M812 98H842L880 60"/>
  <path class="trace" d="M812 118H880"/>
  <path class="trace" d="M812 142H880"/>
  <path class="trace" d="M812 162H842L880 200"/>

  <!-- signal pulses -->
  <path class="pulse" pathLength="100" d="M0 40H598L656 98H668"/>
  <path class="pulse p2" pathLength="100" d="M0 56H574L636 118H668"/>
  <path class="pulse p3" pathLength="100" d="M0 222H540L620 142H668"/>
  <path class="pulse p4" pathLength="100" d="M0 238H592L668 162"/>
  <path class="pulse p5" pathLength="100" d="M812 118H880"/>
  <path class="pulse p6" pathLength="100" d="M812 162H842L880 200"/>

  <!-- vias -->
  <circle class="via" cx="598" cy="40" r="5"/>
  <circle class="via" cx="574" cy="56" r="5"/>
  <circle class="via" cx="540" cy="222" r="5"/>
  <circle class="via" cx="592" cy="238" r="5"/>
  <circle class="via" cx="842" cy="98" r="5"/>
  <circle class="via" cx="842" cy="162" r="5"/>

  <!-- chip -->
  <g>
    <rect class="pin" x="666" y="93" width="16" height="10" rx="2"/>
    <rect class="pin" x="666" y="113" width="16" height="10" rx="2"/>
    <rect class="pin" x="666" y="137" width="16" height="10" rx="2"/>
    <rect class="pin" x="666" y="157" width="16" height="10" rx="2"/>
    <rect class="pin" x="798" y="93" width="16" height="10" rx="2"/>
    <rect class="pin" x="798" y="113" width="16" height="10" rx="2"/>
    <rect class="pin" x="798" y="137" width="16" height="10" rx="2"/>
    <rect class="pin" x="798" y="157" width="16" height="10" rx="2"/>
    <rect x="680" y="78" width="120" height="104" rx="8" fill="#081B30" stroke="#17406A" stroke-width="2"/>
    <circle cx="694" cy="92" r="4" fill="#17406A"/>
    <text class="mark" x="740" y="126" text-anchor="middle">DBV</text>
    <text class="silk" x="740" y="146" text-anchor="middle">vision + AI</text>
    <circle class="led" cx="786" cy="168" r="4"/>
  </g>
  <text class="silk" x="680" y="200">U1</text>

  <!-- identity -->
  <text class="name" x="48" y="128">Diego Barragán</text>
  <text class="role r1" x="50" y="164">Electronics engineer</text>
  <text class="role r2" x="50" y="164">Robotics and AI researcher</text>
  <text class="role r3" x="50" y="164">PhD student building assistive robots</text>
  <text class="role r4" x="50" y="164">University lecturer</text>
  <text class="silk" x="50" y="194">Bogotá, Colombia / open to remote roles</text>
</svg>
